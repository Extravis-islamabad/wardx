[project]
name = "wardx-backend"
version = "0.1.0"
description = "WardX privileged access management — API, vault and workers"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
# S105/S106 flag every "password"/"secret" string, which in a PAM codebase are field names.
ignore = ["B008", "S101", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
